# mcshell — the real session.
#
# Reached from the login screen's session list ("MCShell"; under GDM, the
# gear icon). The display manager runs
# session/start-session.sh, which runs this.
#
# Its counterpart is session/sway.dev.conf, and the difference between them is
# only what a host desktop was stealing. Here Sway is at the top level, so the
# keys CLAUDE.md specifies are actually available: Super is ours, Super+Shift is
# ours, and the media keys reach us instead of Hyprland. Everything the dev
# config binds to a $hatch stand-in is bound to the real key below.
#
# The layout itself is not here. It is in layout.conf, included by both
# configs, so the thing that has been tested nested for weeks is byte for byte
# the thing that runs at login.

# Where the checkout is, without saying where the checkout is. start-session.sh
# knows its own location and exports it before it runs sway, so $repo is just a
# name for that variable. Sway leaves a $NAME it has no `set` for exactly as it
# is, and every `exec` goes through `sh -c` with sway's environment, so the
# shell expands it when a line actually runs. Measured, headless sway 1.12.
#
# One consequence: a bind's command is now `exec $MCSHELL_ROOT/session/…`
# rather than a path to one machine, and so is anything the Controls page
# writes into config.d. Moving the checkout invalidates nothing.
set $repo $MCSHELL_ROOT
set $mod Mod4
# The terminal is the user's: $TERMINAL, the variable i3-sensible-terminal and
# friends read. start-session.sh exports it — from the environment, else from
# ~/.config/environment.d, else foot — so like $repo this is only a name for it.
set $term $TERMINAL

# --- the backdrop behind the backdrop ---------------------------------------
# Only ever visible in the seconds between sway starting and Minecraft mapping,
# which is exactly the window in which a black screen looks like a session that
# failed to start.
output * bg #1a1a2e solid_color

# --- the layout -------------------------------------------------------------
# Fork A: everything floats, Minecraft is the backdrop the rest stack above.
# Relative, which sway resolves against this file's own directory — measured —
# so the layout loads even if the variable above never arrived.
include layout.conf

# --- the session ------------------------------------------------------------
# The units need this compositor's WAYLAND_DISPLAY, SWAYSOCK and DISPLAY, and
# systemd's user manager was started before sway and knows none of them.
#
# One exec, chained, not two lines: sway starts each `exec` concurrently, so as
# two lines the target could be started before the environment it needs exists.
#
# DISPLAY is the one that has already cost a session. Minecraft picks its
# windowing backend at startup, and GLFW falls back to Wayland when there is no
# DISPLAY to use. A native-Wayland client sets no app_id and has no
# window_class, so *nothing* matches it: layout.conf cannot pin it, and the
# daemon skips it as unaddressable. The result is a Minecraft floating at 854x480
# in the middle of the screen and a shell that cannot see its own backdrop.
# XWayland is not a detail here — the window's identity is what the whole
# layout is built on.
exec systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP TERMINAL && systemctl --user start mcshell-session.target

# Authentication stays out of the game client, which is the standing rail:
# credentials never route through Minecraft. This is the agent that draws the
# dialog when something asks for root, as a real window beside swaylock.
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# --- the overview -----------------------------------------------------------
# CLAUDE.md's display model: Super returns to Minecraft. A bare modifier can
# only be bound on release, because on press sway cannot yet know whether you
# meant Super or Super+something.
#
# Which is also the risk in it. If sway fires this after a Super+drag or a
# Super+f, the overview will open on top of whatever you just did. $mod+o does
# the identical thing and cannot misfire, so there is a way to work either way
# while that is settled.
bindsym --release Super_L exec $repo/session/raise-mc.sh
bindsym $mod+o exec $repo/session/raise-mc.sh

# --- windows ----------------------------------------------------------------
# Closing the focused window from the keyboard. Not `kill` directly: sway
# bindings fire whatever is focused, so a bare Alt+F4 would close Minecraft
# when Minecraft is what you are looking at, and Minecraft is the desktop.
# close-focused.sh refuses on the backdrop.
#
# Alt+F4 because that is what a decade of desktops trained into everyone's
# fingers, and $mod+Shift+q because some applications claim Alt+F4 themselves.
# Shift+middle-click on a hotbar slot is the third way, and the only one that
# does not need the window focused.
bindsym Mod1+F4 exec $repo/session/close-focused.sh
bindsym $mod+Shift+q exec $repo/session/close-focused.sh

# $mod+f — back to full screen after a drag — comes from layout.conf, as do
# $mod+drag to move and $mod+right-drag to resize.

# --- safety rails -----------------------------------------------------------
# CLAUDE.md's, verbatim where it gives them. These must work with the daemon
# and Minecraft both dead, so they are compositor bindings and depend on
# nothing but the compositor.
#
# The first one checks for itself rather than going through $term: foot if
# $TERMINAL is empty, unset, *or names a program that is not installed* — a
# typo in environment.d, a terminal uninstalled since. Only sh, never the
# daemon, so it is still a rail. Measured all four in a headless sway.
bindsym $mod+Shift+Return exec sh -c 'command -v "${TERMINAL%% *}" >/dev/null && exec $TERMINAL || exec foot'
bindsym $mod+Return exec $term
bindsym $mod+Shift+m exec systemctl --user restart mcshell-client
bindsym $mod+Shift+d exec systemctl --user restart mcshelld
bindsym $mod+Shift+c reload

# Reading why something broke, without a desktop to read it on.
bindsym $mod+Shift+j exec $term -e journalctl --user -u mcshelld -u mcshell-client -n 100 -f

# The lock screen is swaylock, outside Minecraft, for the same reason the
# polkit agent is.
bindsym $mod+Shift+l exec $repo/session/lock.sh

# Screenshots, for the whole desktop rather than only for the game. Sway sees
# F2 before any window does, so this takes the key away from Minecraft — which
# is the point: with the game as the fullscreen backdrop a grab of the output
# is the same picture, and a browser above it can be captured at all. See
# screenshot.sh. Anything narrower than the whole screen is a bind of your
# own, made on the Controls page.
bindsym F2 exec $repo/session/screenshot.sh

# Leaving. Behind a confirmation because this ends the session, and it sits one
# Shift away from $mod+e in muscle memory built on other desktops.
bindsym $mod+Shift+e exec swaynag -t warning \
	-m 'End the MCShell session and return to the login screen?' \
	-B 'Log out' 'swaymsg exit'

# --- input ------------------------------------------------------------------
# This laptop's touchpad is a clickpad: one physical button under the whole
# surface, and no right button at all. It advertises one anyway — libinput says
# so on every start, "kernel bug: clickpad advertising right button" — and
# taking that claim at face value leaves nothing generating a right click.
#
# Which is not a cosmetic loss here. Right-click is what *launches* an app from
# the hotbar; left-click only focuses and cycles the windows of one already
# running. With no right button, clicking a stopped app does nothing at all,
# correctly, and looks exactly like a broken shell.
#
# clickfinger: one finger clicks left, two click right, three click middle.
#
# dwt disabled — disable-while-typing, and it is the one libinput default this
# shell cannot keep. It turns the touchpad off while a key is held and leaves
# it off until that key comes back up. On a laptop that is palm rejection while
# you write. Here the keyboard is also the movement controls, so holding W is
# indistinguishable from typing a sentence: the touchpad dies for exactly as
# long as you are walking, and comes back the moment you stand still. Which is
# the symptom — look around standing still and it is fine, look around moving
# and nothing is recorded at all.
#
# It reads as a mod bug and is not one. Nothing here is involved: libinput
# suppresses the events before the compositor, let alone the game, ever sees
# them. The tells are that an external mouse is unaffected, since dwt pairs the
# touchpad with the *internal* keyboard and nothing else, and that the same
# thing happens holding a key in any window above the game.
#
# The cost is real and it is session-wide — there is no per-window dwt, so a
# palm resting on the pad while typing into an editor above the game can now
# move the pointer. libinput's other palm detection is untouched: the
# edge zones and the touch-size test are separate from this and stay on. A
# game you cannot look around in while moving is the worse of the two.
input type:touchpad {
	click_method clickfinger
	tap enabled
	dwt disabled
	natural_scroll enabled
}

# --- media and brightness keys ----------------------------------------------
# Rails too, and bound to the tools directly rather than routed through the
# daemon: they have to work when mcshelld is dead. The Sound and Video pages
# follow along anyway, because the daemon watches PipeWire and polls the
# backlight — a page left open moves while you press these.
#
# --locked so they still work over swaylock. wpctl's -l caps at 100%, which
# pactl cannot do; above that is clipping, not loudness.
# Volume goes through session/volume.sh rather than straight to wpctl. It runs
# the same wpctl call first and unconditionally, so this is still a rail that
# works with the daemon and the game both dead — and then it tells the daemon a
# key was pressed, which is the only way the popup can appear for a press that
# changes nothing. Measured: PipeWire emits no event at all for `5%-` at zero,
# so the subscription the bar is normally drawn from has nothing to react to
# and the key reads as broken rather than as already-at-zero.
#
# Brightness and the player keys stay direct: neither has a popup to miss.
bindsym --locked XF86AudioRaiseVolume exec $repo/session/volume.sh up
bindsym --locked XF86AudioLowerVolume exec $repo/session/volume.sh down
bindsym --locked XF86AudioMute exec $repo/session/volume.sh mute
bindsym --locked XF86AudioMicMute exec $repo/session/volume.sh micmute
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous

# This is the first session in which those can actually fire. Nested, Hyprland
# binds the volume keys itself and swayosd-libinput-backend takes the rest, so
# the host acted on every press and the nested Sway never saw one — which is
# why the dev config carries $hatch stand-ins and this one does not.

# --- rebound keys -----------------------------------------------------------
# Last, so it wins: the Controls settings page writes
# ~/.config/sway/config.d/mcshell-binds.conf, which unbinds a key and rebinds
# the command onto a new one. Rebinding works without this include — the daemon
# also tells Sway at runtime — but only until the next reload.
include $HOME/.config/sway/config.d/*.conf
