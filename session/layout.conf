# mcshell — the window layout.
#
# Included by both sway.dev.conf and sway.conf, so the nested session and the
# real one agree about where windows go. It lives in the compositor rather than
# in the daemon because it has to keep holding when mcshelld is dead, which is
# the same reason the safety rails are bound here.
#
# CLAUDE.md's display model is Fork A: Minecraft fills the screen, applications
# raise above it, Super returns to Minecraft. This file is the whole of that.
#
# --- why everything floats ---
#
# Sway draws floating windows above tiled ones, always. So the obvious reading
# of Fork A — Minecraft the only tiled window, apps floating over it — gets the
# first half right and makes the second half impossible: a tiled Minecraft can
# never come back above a floating app, so Super would focus it without
# revealing it. (CLAUDE.md guessed at that arrangement while parking this for
# M7. Measured, it doesn't work.)
#
# So everything floats, Minecraft included, and the stacking order does the
# work. Focusing a floating window raises it — sway moves it to the end of the
# workspace's floating_nodes, which *is* the stacking order. That one fact
# gives all three parts of Fork A with no state to keep:
#
#   launch an app     → it maps focused, so it lands on top
#   activate a slot   → the daemon's `focus` raises that window
#   Super             → raise-mc.sh focuses Minecraft, which covers everything
#
# The alternative was to fullscreen Minecraft on Super and un-fullscreen it
# whenever an app launched. That is a state machine, and it fails in the open
# position: if the daemon dies between the two, Minecraft is stuck covering a
# window you can no longer reach.

for_window [app_id=".*"] floating enable
for_window [class=".*"] floating enable

# --- moving and resizing ----------------------------------------------------
#
# A floating window can be dragged by its titlebar and resized by a two-pixel
# edge, and that is all, unless a modifier claims the whole surface — and sway
# binds no modifier for it unless told to. Without this line an application
# that opens at an awkward size is stuck at it.
#
#   $mod + left-drag    move
#   $mod + right-drag   resize
#
# $mod is whatever the config that included this file set it to: Alt nested,
# Super in the real session. Both get the modifier that is already theirs.
floating_modifier $mod normal

# Titlebars are the other half of that — they are what makes a window movable
# for someone who does not know the modifier exists. Stated rather than left
# to sway's default, because we now depend on it.
default_floating_border normal

# And a way back: $mod+f puts the focused window at the full size of the
# screen again, which is where an application started before you dragged it.
# Sway's own fullscreen is off limits here — see the backdrop note below — so
# this is the same fill mcshelld does when an application appears, and it
# needs a script for the same reason: two resizes with a pause between.
#
# $repo, like $mod, comes from whichever config included this file.
bindsym $mod+f exec $repo/session/fill.sh

# --- how big an application opens -------------------------------------------
#
# Not decided here. A floating window keeps whatever size its client asked
# for, which for most applications is a middling rectangle in the middle of
# the screen with Minecraft visible all round it — the shell reading as a game
# with a window on top rather than as a desktop. mcshelld fills each
# application to the whole output as it appears.
#
# That is the daemon's job rather than another `for_window` line for two
# reasons. The fill needs two resizes straddling the client's commit, for the
# reason written under the backdrop below, and a config line can only do one.
# And it has to spare dialogs: sudo's password prompt is a window like any
# other here, and a full-screen password prompt would be absurd. Which windows
# are applications is a decision, and decisions live in the daemon.
#
# With mcshelld dead, applications open at their own size on top of Minecraft.
# Degraded, still usable, and the escape-hatch terminal still comes up.

# --- Minecraft is the backdrop ----------------------------------------------
#
# Undecorated, and the size of the whole output. Matched on window_class
# because the client runs under XWayland; the app_id line is there for the day
# it runs as a native Wayland client, and matches nothing until then.
#
# Do not run Minecraft in its own fullscreen mode. An XWayland fullscreen
# request makes it a fullscreen *container*, and sway then draws nothing else
# on the workspace — apps would launch and be invisible. Windowed is correct;
# the pin below fills the screen anyway.
for_window [class="^Minecraft"] border none
for_window [class="^Minecraft"] floating enable, resize set 100ppt 100ppt, move position 0 0
for_window [app_id="^[Mm]inecraft"] border none
for_window [app_id="^[Mm]inecraft"] floating enable, resize set 100ppt 100ppt, move position 0 0

# That lands a few pixels short — 1278x715 on a 1280x720 output — and it is
# not fixable from here. Sway works `100ppt` out against the size the client
# has committed to, which at map time is whatever the window first asked for,
# so the first resize is always approximate and the second is exact. Writing it
# twice on this line does not help: sway takes a whole message against one
# snapshot, and the two have to straddle the client's commit.
#
# So this rule is a first approximation, and the daemon corrects it a moment
# later, when it sees the Minecraft window appear.
#
# The pin is re-asserted in two further places, because a `for_window` rule
# runs once and a backdrop can go stale afterwards. raise-mc.sh re-runs it before
# focusing, so Super repairs the layout if anything ever moved or resized
# Minecraft; and the daemon re-runs it whenever an output changes shape, since
# sway clamps floating windows into a new mode rather than growing them to fill
# it — which is exactly what changing the resolution from the Video page does.
