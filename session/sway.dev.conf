# mcshell — nested development session.
#
#   session/start-nested.sh
#
# Runs a full Sway instance in a window on the host desktop, with its own IPC
# socket. mcshelld is exec'd from in here so it inherits the *nested* $SWAYSOCK
# rather than the host's — that is the whole point of this file.
#
# Through the script rather than `sway -c` directly, because the script is what
# says where the checkout is: $MCSHELL_ROOT, the same variable start-session.sh
# exports for the real session. See sway.conf for why that works.
set $repo $MCSHELL_ROOT
# start-nested.sh defaults it to kitty rather than foot, which is what this
# file always used; a $TERMINAL of your own wins in both.
set $term $TERMINAL

# $mod is Alt, not Super: Super belongs to the host session while we're nested.
set $mod Mod1

# ...but Alt+Shift is unusable here. The host (Hyprland) sets
#   kb_options = grp:alt_shift_toggle
# so xkb claims every Alt+Shift chord as a layout-switch before it is forwarded
# to this nested session. Bindings on $mod+Shift register fine and then simply
# never fire, which looks exactly like a broken config.
#
# $hatch is the dev stand-in. The real session (M7) runs Sway at the top level
# with no host to intercept anything, and goes back to $mod+Shift as CLAUDE.md
# specifies.
#
# (Clearing grp:alt_shift_toggle on the host also fixes it — kb_layout is `us`
# alone, so there is no second group for it to toggle to. Host config, so it is
# left alone here.)
set $hatch Ctrl+Mod1

# Also claimed by the host and never delivered here: Alt+Tab, Alt+F4.

# Nested sway sizes its window from the output resolution.
output * resolution 1600x900

# The background, drawn by swaybg. Only ever visible in the seconds before
# Minecraft maps, which is exactly when a black screen is indistinguishable
# from a session that failed to start.
output * bg #1a1a2e solid_color

# --- the layout -------------------------------------------------------------
# Fork A: everything floats and Minecraft is the backdrop the rest stack above.
# Shared with the real session (M7) rather than copied, so the two cannot drift.
include layout.conf

# --- mcshelld ---------------------------------------------------------------
# Via restart-daemon.sh rather than the binary directly: the socket path is
# shared across nested instances, so a second session would otherwise find the
# first session's daemon holding it and refuse to start — leaving a daemon
# bound to the *other* sway's IPC and reporting the wrong windows. The restart
# script makes the newest nested session take ownership.
#
# -v is set inside the script; logs land in $XDG_RUNTIME_DIR/mcshelld.log, and
# $hatch+l opens a tail on them.
exec $repo/session/restart-daemon.sh

# --- the Minecraft client ----------------------------------------------------
# Launched from in here for the same reason as the daemon: it must inherit this
# session's WAYLAND_DISPLAY/DISPLAY, or it renders on the host desktop and talks
# to the host compositor.
#
# Two clients, and this is where you choose between them. They are different
# installs and CLAUDE.md keeps them that way: the Fabric dev client for
# iteration, and the Prism instance for testing what the real session will
# actually run — the pinned performance mods, 1G of heap, the shell world.
# Swap which line is commented to test the other. $hatch+m restarts whichever
# is selected.
#
# Prism refuses to start an instance that is already running, so $hatch+m is a
# restart only for the dev client; for Prism, quit the game first.
# set $client $repo/session/run-client.sh
set $client $repo/session/prism/launch.sh

# First start is slow — gradle compiles the mod, and a cold gradle daemon adds
# more. Expect the better part of a minute of blank screen. $hatch+j follows the
# log if it is taking longer than that. (Prism is slower still on a cold start,
# and logs to its own console rather than to that file.)
exec $client

# --- window management ------------------------------------------------------
bindsym $mod+Return exec $term
bindsym $hatch+q kill
bindsym $hatch+e exit
bindsym $hatch+c reload

# --- escape hatches ---------------------------------------------------------
# These must work even when the daemon and Minecraft are both dead, so they stay
# bound in the compositor and depend on nothing but the compositor itself.
# Checks for itself, not $term: foot unless $TERMINAL names something
# installed. See sway.conf.
bindsym $hatch+Return exec sh -c 'command -v "${TERMINAL%% *}" >/dev/null && exec $TERMINAL || exec foot'

# Real session (M7) uses systemd units, on the CLAUDE.md bindings:
#   bindsym $mod+Shift+m exec systemctl --user restart mcshell-client
#   bindsym $mod+Shift+d exec systemctl --user restart mcshelld
# No units exist yet, and there is no client until M2, so:
bindsym $hatch+d exec $repo/session/restart-daemon.sh
# F2 — the whole screen, to ~/Pictures/Screenshots and to the clipboard. Not
# $hatch-prefixed: the host does not bind F2, so the nested session really
# does get it, and grim inherits this compositor's WAYLAND_DISPLAY and so
# captures the nested output rather than the desktop behind it.
bindsym F2 exec $repo/session/screenshot.sh
bindsym $hatch+m exec $client

# --- the overview ------------------------------------------------------------
# CLAUDE.md binds this to Super: raise Minecraft, open the overview. Nested,
# Super belongs to the host session, so $mod+o is the dev stand-in. The real
# session (M7) runs Sway at the top level and gets the real key:
#   bindsym $mod exec $repo/session/raise-mc.sh
bindsym $mod+o exec $repo/session/raise-mc.sh

# --- dev conveniences -------------------------------------------------------
# $hatch+l — follow the daemon log
bindsym $hatch+l exec $term -e sh -c 'tail -n50 -f $XDG_RUNTIME_DIR/mcshelld.log'
# $hatch+j — follow the Minecraft client log (gradle, then the game's own stdout)
bindsym $hatch+j exec $term -e sh -c 'tail -n50 -f $XDG_RUNTIME_DIR/mcshell-client.log'
# $hatch+w — dump the live window list via the mcsh harness
bindsym $hatch+w exec $term -e sh -c '$repo/daemon/tools/mcsh windows; printf "\n[enter to close] "; read x'

# --- media and brightness keys ----------------------------------------------
# The keyboard's own volume and brightness keys. Nothing was listening for
# these, so inside the nested session they did nothing at all: Sway had no
# binding, and Minecraft ignores them.
#
# Bound in Sway rather than routed through the daemon, for the same reason the
# safety rails are: they have to work when mcshelld is dead, which during
# development is often. The Sound and Video pages follow along anyway — the
# daemon watches PipeWire and polls the backlight, so a page left open moves
# while you press them.
#
# --locked so they still work over a lock screen. wpctl's -l caps at 100%,
# which pactl cannot do; above that is clipping, not loudness.
# Volume goes through session/volume.sh rather than straight to wpctl. It runs
# the same wpctl call first and unconditionally, so this is still a rail that
# works with the daemon and the game both dead — and then it tells the daemon a
# key was pressed, which is the only way the popup can appear for a press that
# changes nothing. Measured: PipeWire emits no event at all for `5%-` at zero,
# so the subscription the bar is normally drawn from has nothing to react to
# and the key reads as broken rather than as already-at-zero.
#
# Brightness and the player keys stay direct: neither has a popup to miss.
bindsym --locked XF86AudioRaiseVolume exec $repo/session/volume.sh up
bindsym --locked XF86AudioLowerVolume exec $repo/session/volume.sh down
bindsym --locked XF86AudioMute exec $repo/session/volume.sh mute
bindsym --locked XF86AudioMicMute exec $repo/session/volume.sh micmute
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous

# Nested, none of the above can fire. Hyprland binds the volume keys itself
# (keybindings.conf lines 52-55) and swayosd-libinput-backend is running, so
# the host acts on them and the nested Sway never sees the press. Exactly like
# Super: the real session gets the real keys, and dev gets a stand-in.
bindsym $hatch+equal exec $repo/session/volume.sh up
bindsym $hatch+minus exec $repo/session/volume.sh down
bindsym $hatch+0 exec $repo/session/volume.sh mute
bindsym $hatch+bracketright exec brightnessctl set 5%+
bindsym $hatch+bracketleft exec brightnessctl set 5%-

# --- rebound keys -----------------------------------------------------------
# Last, so it wins: the Controls settings page writes
# ~/.config/sway/config.d/mcshell-binds.conf, which unbinds a key and rebinds
# the command onto a new one. Rebinding works without this include — the daemon
# also tells Sway at runtime — but only until the next reload.
include $HOME/.config/sway/config.d/*.conf
