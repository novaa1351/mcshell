[project]
name = "mcshelld"
version = "0.0.0"
description = "mcshell daemon — Minecraft as a Linux desktop shell"
requires-python = ">=3.11"
dependencies = [
    "i3ipc>=2.2.1",
    "pyxdg>=0.28",
    # The session bus, for org.freedesktop.Notifications. Optional at runtime:
    # without it the daemon logs that there are no notifications and comes up.
    "dbus-next>=0.2.3",
]

[project.optional-dependencies]
# The suite in tests/: `uv pip install -e '.[test]'`, then `.venv/bin/pytest`.
test = ["pytest>=8"]

[project.scripts]
mcshelld = "mcshelld.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcshelld"]

[tool.pytest.ini_options]
testpaths = ["tests"]
